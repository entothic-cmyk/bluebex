<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bluebex AI - Auth</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#18181a] text-[#e3e3e3] h-screen flex flex-col items-center justify-between py-12 font-sans">

  <div></div>

  <!-- Form Container -->
  <div class="w-full max-w-sm px-6 space-y-6 text-center">
    
    <!-- Branding -->
    <div class="flex items-center justify-center gap-2 mb-8">
      <img src="logo.png" alt="Logo" class="h-8 w-auto" onerror="this.style.display='none'">
      <span class="font-bold text-2xl text-white tracking-tight">bluebex</span>
    </div>

    <!-- Auth Form -->
    <form id="auth-form" class="space-y-3">
      
      <input 
        type="email" 
        placeholder="Phone number / email address" 
        class="w-full bg-[#212124] border border-[#2e2f38] rounded-full px-5 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition"
        required
      >

      <input 
        type="password" 
        placeholder="Password" 
        class="w-full bg-[#212124] border border-[#2e2f38] rounded-full px-5 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition"
        required
      >

      <div id="confirm-pass-box" class="hidden">
        <input 
          type="password" 
          placeholder="Confirm password" 
          class="w-full bg-[#212124] border border-[#2e2f38] rounded-full px-5 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition"
        >
      </div>

      <p class="text-[11px] text-gray-500 pt-1 leading-relaxed">
        By signing up or logging in, you consent to Bluebex's <br>
        <a href="#" class="text-gray-300 underline">Terms of Use</a> and <a href="#" class="text-gray-300 underline">Privacy Policy</a>.
      </p>

      <div class="flex justify-between items-center text-xs text-blue-500 px-2 py-1">
        <a href="#" class="hover:underline">Forgot password?</a>
        <button type="button" id="toggle-auth" class="hover:underline">Sign up</button>
      </div>

      <button type="submit" id="submit-btn" class="w-full bg-[#4c71f0] hover:bg-blue-600 text-white font-medium py-3 rounded-full transition shadow-md">
        Log in
      </button>

      <div class="flex justify-center gap-4 text-xs text-gray-400 pt-2">
        <a href="#" class="hover:underline">Log in with Google</a>
        <span>|</span>
        <a href="#" class="hover:underline">Login with Apple</a>
      </div>

    </form>
  </div>

  <!-- Footer -->
  <div class="text-xs text-gray-600">
    Bluebex Pvt Ltd · Contact us
  </div>

  <script>
    let isLogin = true;
    const toggleBtn = document.getElementById('toggle-auth');
    const submitBtn = document.getElementById('submit-btn');
    const confirmBox = document.getElementById('confirm-pass-box');

    toggleBtn.addEventListener('click', () => {
      isLogin = !isLogin;
      if (isLogin) {
        submitBtn.textContent = 'Log in';
        toggleBtn.textContent = 'Sign up';
        confirmBox.classList.add('hidden');
      } else {
        submitBtn.textContent = 'Sign up';
        toggleBtn.textContent = 'Log in';
        confirmBox.classList.remove('hidden');
      }
    });

    document.getElementById('auth-form').addEventListener('submit', (e) => {
      e.preventDefault();
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
