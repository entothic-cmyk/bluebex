<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bluebex AI</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233b82f6'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#f8fafc] text-gray-800 h-screen flex flex-col font-sans overflow-hidden">

  <!-- Floating Header -->
  <header class="fixed top-3 left-1/2 -translate-x-1/2 w-[95%] max-w-5xl bg-white/90 backdrop-blur-md rounded-full px-6 py-2.5 flex items-center justify-between z-50 shadow-sm border border-gray-200/80">
    <div class="flex items-center gap-2.5 cursor-pointer" id="brand-home">
      <div class="w-7 h-7 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-xs shadow-sm">
        B
      </div>
      <span class="font-bold text-lg text-gray-900 tracking-tight">bluebex</span>
    </div>
    <div class="flex items-center gap-3 text-xs font-medium">
      <button id="clear-data-btn" class="px-3 py-1.5 rounded-full text-gray-500 hover:text-red-600 hover:bg-red-50 transition flex items-center gap-1 border border-gray-200">
        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Clear Data
      </button>
      <div class="flex bg-gray-100 p-0.5 rounded-full border border-gray-200">
        <button id="lang-cn" class="px-2.5 py-1 rounded-full text-gray-500 hover:text-black">中文</button>
        <button id="lang-en" class="px-2.5 py-1 rounded-full bg-white shadow-sm font-semibold text-black">EN</button>
      </div>
    </div>
  </header>

  <!-- Scrollable Chat Feed Area -->
  <main class="flex-1 overflow-y-auto px-4 pt-24 pb-36 flex flex-col items-center" id="chat-container">
    <div class="w-full max-w-2xl flex flex-col my-auto" id="messages-wrapper">
      
      <!-- Welcome Screen (Visible when chat is empty) -->
      <div id="welcome-screen" class="flex flex-col items-center justify-center text-center space-y-4 py-12">
        <div class="inline-flex items-center gap-1.5 px-3 py-1 text-xs text-gray-500 bg-white border border-gray-200 rounded-full shadow-2xs">
          <span class="text-blue-500">✨</span>
          <span>Bluebex-V4.1-Flash Active</span>
        </div>
        <h1 class="text-4xl font-normal text-gray-800 tracking-tight">
          Into the Unknown
        </h1>
      </div>

      <!-- Messages List -->
      <div id="messages-list" class="space-y-6 w-full hidden"></div>

    </div>
  </main>

  <!-- Always-Visible Fixed Bottom Input Box -->
  <footer class="fixed bottom-0 left-0 right-0 bg-gradient-to-t from-[#f8fafc] via-[#f8fafc]/90 to-transparent pt-6 pb-6 px-4 flex justify-center z-40">
    <div class="w-full max-w-2xl bg-white border border-gray-200 rounded-2xl shadow-lg p-3 transition-all focus-within:ring-2 focus-within:ring-blue-500/20">
      <form id="chat-form" class="flex flex-col gap-2">
        <input type="file" id="file-upload" class="hidden" accept=".txt,.js,.py,.html,.css,.json,.md,.csv">
        
        <div id="attachment-badge" class="hidden items-center gap-2 px-2.5 py-1 bg-blue-50 text-blue-700 text-xs rounded-lg w-fit">
          <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
          <span id="attachment-name">file.txt</span>
          <button type="button" id="remove-attachment" class="hover:text-red-500 ml-1">×</button>
        </div>

        <textarea
          id="user-input"
          rows="2"
          placeholder="Ask anything, explore together..."
          class="w-full bg-transparent border-none outline-none text-gray-800 placeholder-gray-400 px-2 text-sm resize-none"
          required
        ></textarea>
        
        <div class="flex items-center justify-between pt-1 border-t border-gray-100">
          <div class="flex items-center gap-1.5">
            <button type="button" onclick="document.getElementById('file-upload').click()" class="flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium text-gray-600 bg-gray-100 hover:bg-gray-200 transition">
              <i data-lucide="paperclip" class="w-3.5 h-3.5"></i> Attach
            </button>
            <button type="button" id="toggle-deepthink" class="flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium text-gray-600 bg-gray-100 hover:bg-gray-200 transition">
              <i data-lucide="brain" class="w-3.5 h-3.5"></i> DeepThink
            </button>
            <button type="button" id="toggle-search" class="flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium text-blue-600 bg-blue-50 hover:bg-blue-100 transition">
              <i data-lucide="globe" class="w-3.5 h-3.5"></i> Search
            </button>
          </div>
          <button type="submit" class="p-2 bg-blue-600 text-white rounded-full hover:bg-blue-700 transition shadow-sm">
            <i data-lucide="arrow-up" class="w-4 h-4"></i>
          </button>
        </div>
      </form>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
