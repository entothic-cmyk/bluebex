<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueBex AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['Fira Code', 'monospace'] },
                    colors: {
                        brand: { 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
                        darkBg: '#0f0f11', darkSidebar: '#18181c', darkCard: '#212126', darkBorder: '#2e2e35'
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 9999px; }
        .hidden-view { display: none !important; opacity: 0; pointer-events: none; }
        .sky-light-bg {
            background: linear-gradient(180deg, #e8f3fe 0%, #f4f8fc 35%, #ffffff 100%);
            position: relative;
        }
        .sky-light-bg::before {
            content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 1200px; height: 400px;
            background: radial-gradient(circle at 50% 20%, rgba(191, 219, 254, 0.6) 0%, rgba(239, 246, 255, 0) 70%);
            pointer-events: none;
        }
    </style>
</head>
<body class="h-full bg-darkBg text-slate-100 font-sans antialiased">

    <div id="app" class="h-full flex flex-col">

        <!-- ================= LANDING VIEW ================= -->
        <section id="view-landing" class="view-section min-h-screen flex flex-col justify-between sky-light-bg text-slate-800">
            <header class="w-full max-w-7xl mx-auto px-6 py-4 flex items-center justify-between z-10">
                <div class="flex items-center gap-2.5">
                    <img src="logo.png" onerror="this.style.display='none'" class="w-8 h-8 rounded-lg">
                    <span class="font-bold text-xl text-slate-900 tracking-tight">BlueBex AI</span>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="switchView('auth', 'signin')" class="px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-200/50 rounded-lg">Sign In</button>
                    <button onclick="switchView('auth', 'signup')" class="px-4 py-2 text-sm font-medium bg-brand-600 hover:bg-brand-700 text-white rounded-xl shadow-sm">Sign Up</button>
                </div>
            </header>

            <main class="flex-1 flex flex-col items-center justify-center px-4 max-w-4xl mx-auto w-full text-center py-12 z-10">
                <h1 class="text-4xl sm:text-6xl font-bold tracking-tight text-slate-900 mb-8">Into the Unknown</h1>
                <div class="w-full max-w-2xl bg-white/90 backdrop-blur-md rounded-2xl border border-slate-200/80 shadow-xl p-4 text-left mb-6">
                    <textarea id="landing-prompt" rows="2" placeholder="Ask anything, explore together" class="w-full bg-transparent outline-none resize-none text-slate-800 placeholder-slate-400 text-base"></textarea>
                    <div class="flex items-center justify-end pt-3 border-t border-slate-100">
                        <button onclick="switchView('auth', 'signup')" class="w-9 h-9 rounded-full bg-brand-600 hover:bg-brand-700 text-white flex items-center justify-center shadow-md">
                            <i class="fa-solid fa-arrow-up"></i>
                        </button>
                    </div>
                </div>
            </main>
        </section>

        <!-- ================= FULL-SCREEN AUTHENTICATION VIEW ================= -->
        <section id="view-auth" class="view-section hidden-view h-screen w-full relative flex items-center justify-center">
            <!-- Full Screen Background Image -->
            <div class="absolute inset-0 z-0">
                <img src="login.png" onerror="this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1920&q=80'" class="w-full h-full object-cover">
                <div class="absolute inset-0 bg-black/60 backdrop-blur-sm"></div>
            </div>

            <!-- Floating Auth Card -->
            <div class="relative z-10 w-full max-w-md p-8 bg-[#18181c]/95 border border-darkBorder rounded-3xl shadow-2xl">
                
                <!-- Sign In Form -->
                <div id="auth-form-signin" class="space-y-6">
                    <h2 class="text-3xl font-bold text-white">Sign In</h2>
                    <form onsubmit="handleAuth(event, 'signin')" class="space-y-5">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1.5">E-mail</label>
                            <input type="email" id="signin-email" required placeholder="name@domain.com" class="w-full px-4 py-3 rounded-xl bg-[#212126] border border-[#2e2e35] text-white text-sm focus:outline-none focus:border-brand-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1.5">Password</label>
                            <input type="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-[#212126] border border-[#2e2e35] text-white text-sm focus:outline-none focus:border-brand-500">
                        </div>
                        <button type="submit" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-xl text-sm shadow-lg transition">Continue</button>
                    </form>
                    <p class="text-sm text-slate-400 mt-4 text-center">New to BlueBex? <button onclick="toggleAuthMode('signup')" class="text-brand-400 hover:underline">Sign Up</button></p>
                </div>

                <!-- Sign Up Form -->
                <div id="auth-form-signup" class="space-y-6 hidden">
                    <h2 class="text-3xl font-bold text-white">Sign Up</h2>
                    <form onsubmit="handleAuth(event, 'signup')" class="space-y-5">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1.5">E-mail</label>
                            <input type="email" id="signup-email" required placeholder="name@domain.com" class="w-full px-4 py-3 rounded-xl bg-[#212126] border border-[#2e2e35] text-white text-sm focus:outline-none focus:border-brand-500">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 mb-1.5">Create Password</label>
                            <input type="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-[#212126] border border-[#2e2e35] text-white text-sm focus:outline-none focus:border-brand-500">
                        </div>
                        <button type="submit" class="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-xl text-sm shadow-lg transition">Create Account</button>
                    </form>
                    <p class="text-sm text-slate-400 mt-4 text-center">Already have an account? <button onclick="toggleAuthMode('signin')" class="text-brand-400 hover:underline">Sign In</button></p>
                </div>
            </div>
        </section>

        <!-- ================= CHAT WORKSPACE ================= -->
        <section id="view-chat" class="view-section hidden-view h-screen w-full flex bg-darkBg text-slate-200 overflow-hidden">
            <!-- Sidebar -->
            <aside class="w-64 bg-darkSidebar border-r border-darkBorder flex flex-col justify-between p-3 shrink-0">
                <div class="flex flex-col gap-3">
                    <div class="flex items-center gap-2 px-2 py-1">
                        <img src="logo.png" onerror="this.style.display='none'" class="w-6 h-6 rounded">
                        <span class="font-semibold text-sm text-slate-100">BlueBex AI</span>
                    </div>
                    <button onclick="startNewChat()" class="w-full py-2.5 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-sm font-medium flex items-center gap-2 justify-center">
                        <i class="fa-solid fa-plus text-xs"></i> New chat
                    </button>
                    <div id="chat-history-list" class="flex flex-col gap-1 mt-2 overflow-y-auto max-h-[60vh]"></div>
                </div>
                <div class="pt-3 border-t border-darkBorder">
                    <div class="flex items-center gap-2.5 p-2 rounded-xl hover:bg-white/5 cursor-pointer">
                        <div id="user-avatar" class="w-8 h-8 rounded-full bg-purple-600 text-white font-bold flex items-center justify-center text-xs">U</div>
                        <span id="user-name" class="text-xs font-medium text-slate-200 truncate">User</span>
                    </div>
                </div>
            </aside>

            <!-- Main Chat Area -->
            <main class="flex-1 flex flex-col bg-darkBg relative h-full">
                <header class="h-14 border-b border-darkBorder flex items-center px-6 shrink-0 bg-darkBg/95">
                    <h3 class="font-medium text-sm text-slate-200">deepseek-v4.1</h3>
                </header>
                
                <div id="chat-messages" class="flex-1 overflow-y-auto px-6 py-6 space-y-6"></div>

                <div class="p-4 max-w-4xl mx-auto w-full shrink-0">
                    <div id="file-preview-bar" class="hidden flex gap-2 mb-2 px-2"></div>
                    <div class="bg-darkCard rounded-2xl border border-darkBorder p-3 shadow-xl">
                        <textarea id="chat-input" rows="2" placeholder="Message BlueBex..." class="w-full bg-transparent outline-none resize-none text-slate-200 placeholder-slate-500 text-sm px-2"></textarea>
                        <div class="flex items-center justify-between pt-2">
                            <div class="flex items-center gap-2">
                                <button onclick="document.getElementById('file-upload').click()" class="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-white/5 transition">
                                    <i class="fa-solid fa-paperclip"></i>
                                </button>
                                <input type="file" id="file-upload" class="hidden" multiple onchange="handleFiles(event)">
                            </div>
                            <button id="send-btn" onclick="sendMessage()" class="w-8 h-8 rounded-full bg-brand-600 hover:bg-brand-700 text-white flex items-center justify-center shadow">
                                <i class="fa-solid fa-arrow-up text-xs"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </main>
        </section>
    </div>

    <script>
        let currentUser = null;
        let messages = [];
        let attachedFiles = [];

        function switchView(viewName, mode = 'signin') {
            document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden-view'));
            document.getElementById(`view-${viewName}`).classList.remove('hidden-view');
            if(viewName === 'auth') toggleAuthMode(mode);
            if(viewName === 'chat' && messages.length === 0) startNewChat();
        }

        function toggleAuthMode(mode) {
            document.getElementById('auth-form-signin').classList.toggle('hidden', mode !== 'signin');
            document.getElementById('auth-form-signup').classList.toggle('hidden', mode !== 'signup');
        }

        function handleAuth(e, mode) {
            e.preventDefault();
            const email = document.getElementById(`${mode}-email`).value;
            currentUser = { email, name: email.split('@')[0] };
            document.getElementById('user-name').innerText = currentUser.name;
            document.getElementById('user-avatar').innerText = currentUser.name.charAt(0).toUpperCase();
            switchView('chat');
        }

        function handleFiles(e) {
            Array.from(e.target.files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    attachedFiles.push({ name: file.name, data: ev.target.result, type: file.type });
                    renderFiles();
                };
                reader.readAsDataURL(file);
            });
        }

        function renderFiles() {
            const bar = document.getElementById('file-preview-bar');
            if (attachedFiles.length === 0) { bar.classList.add('hidden'); return; }
            bar.classList.remove('hidden');
            bar.innerHTML = attachedFiles.map((f, i) => `
                <div class="flex items-center gap-2 px-3 py-1 rounded-lg bg-brand-500/10 border border-brand-500/20 text-brand-400 text-xs">
                    <i class="fa-solid fa-image"></i> <span class="truncate max-w-[100px]">${f.name}</span>
                    <button onclick="attachedFiles.splice(${i}, 1); renderFiles()"><i class="fa-solid fa-xmark"></i></button>
                </div>
            `).join('');
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text && attachedFiles.length === 0) return;

            // Construct payload content
            let userContent = text;
            if (attachedFiles.length > 0) {
                userContent += `\n[User attached ${attachedFiles.length} file(s)]`; 
            }

            messages.push({ role: 'user', content: userContent });
            
            input.value = '';
            attachedFiles = [];
            renderFiles();
            renderMessages();

            // API Call to Botliy via Vercel proxy
            const btn = document.getElementById('send-btn');
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin text-xs"></i>`;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages })
                });
                const data = await res.json();
                
                if (data.choices && data.choices[0]) {
                    messages.push(data.choices[0].message);
                } else {
                    messages.push({ role: 'assistant', content: `⚠️ API Error: ${data.error || 'Failed to connect.'}` });
                }
            } catch (err) {
                messages.push({ role: 'assistant', content: `⚠️ System Error: ${err.message}` });
            }

            btn.innerHTML = `<i class="fa-solid fa-arrow-up text-xs"></i>`;
            renderMessages();
        }

        function renderMessages() {
            const container = document.getElementById('chat-messages');
            container.innerHTML = messages.map(msg => {
                const isUser = msg.role === 'user';
                
                // Code block parsing
                let htmlContent = msg.content;
                if (htmlContent.includes('```')) {
                    const parts = htmlContent.split('```');
                    htmlContent = parts.map((part, i) => {
                        if (i % 2 === 1) {
                            const lines = part.trim().split('\n');
                            const code = lines.slice(1).join('\n');
                            return `<div class="w-full bg-[#141417] border border-[#2e2e35] rounded-xl overflow-hidden my-3 shadow-lg">
                                <div class="px-4 py-2 flex items-center justify-between text-xs bg-[#212126] text-slate-400 border-b border-[#2e2e35]">
                                    <span>${lines[0] || 'code'}</span>
                                </div>
                                <pre class="p-4 overflow-x-auto text-xs font-mono text-brand-100"><code>${code.replace(/</g, '&lt;')}</code></pre>
                            </div>`;
                        }
                        return `<p class="whitespace-pre-wrap">${part}</p>`;
                    }).join('');
                } else {
                    htmlContent = `<p class="whitespace-pre-wrap">${htmlContent}</p>`;
                }

                return `
                <div class="flex gap-4 max-w-3xl mx-auto ${isUser ? 'justify-end' : 'justify-start'}">
                    ${!isUser ? `<div class="w-8 h-8 rounded-lg bg-brand-600 text-white flex items-center justify-center shrink-0 mt-1"><i class="fa-solid fa-robot text-xs"></i></div>` : ''}
                    <div class="p-4 rounded-2xl text-sm leading-relaxed ${isUser ? 'bg-[#282830] text-slate-100 max-w-[85%] border border-white/5' : 'text-slate-200 w-full'}">
                        ${htmlContent}
                    </div>
                </div>`;
            }).join('');
            container.scrollTop = container.scrollHeight;
        }

        function startNewChat() {
            messages = [];
            renderMessages();
            const list = document.getElementById('chat-history-list');
            list.innerHTML = `<div class="p-2 rounded-lg bg-white/10 text-xs text-white cursor-pointer"><i class="fa-regular fa-message mr-2"></i>New Chat</div>`;
        }
    </script>
</body>
</html>
