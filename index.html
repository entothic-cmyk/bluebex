<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bluebex AI</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
  
  <!-- Dependencies -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: #f4f7fb;
      background-image: 
        radial-gradient(circle at 50% 25%, rgba(219, 234, 254, 0.65) 0%, rgba(244, 247, 251, 0) 60%),
        radial-gradient(#e2e8f0 1.2px, transparent 1.2px);
      background-size: 100% 100%, 28px 28px;
      background-attachment: fixed;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }

    textarea { outline: none !important; box-shadow: none !important; }

    .prose p { margin-bottom: 0.5rem; }
    .prose p:last-child { margin-bottom: 0; }
    .prose pre {
      background-color: #0f172a;
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      color: #f8fafc;
      font-size: 0.85rem;
      overflow-x: auto;
      margin: 0.5rem 0;
    }
    .prose code {
      color: #1e40af;
      background-color: #eff6ff;
      padding: 0.15rem 0.3rem;
      border-radius: 0.375rem;
      font-size: 0.85em;
    }
    .prose pre code { color: inherit; background: transparent; padding: 0; }
  </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden">

  <!-- Header with Big Logo -->
  <header class="fixed top-0 left-0 right-0 w-full px-8 py-5 flex items-center justify-between z-50 bg-transparent">
    <div class="flex items-center gap-3 cursor-pointer" onclick="location.reload()">
      <div class="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center text-white font-black text-lg shadow-md">
        B
      </div>
      <span class="font-extrabold text-2xl text-blue-600 tracking-tight">bluebex</span>
    </div>

    <div class="flex items-center gap-3 text-xs font-semibold text-gray-600">
      <div class="flex bg-gray-200/60 p-0.5 rounded-full">
        <button class="px-3 py-1 rounded-full text-gray-500">中文</button>
        <button class="px-3 py-1 rounded-full bg-white shadow-xs text-black">EN</button>
      </div>
    </div>
  </header>

  <!-- Main View Area -->
  <main class="flex-1 flex flex-col items-center justify-center relative overflow-y-auto px-4" id="main-container">
    
    <!-- Hero Center Screen (Home) -->
    <div id="hero-view" class="w-full max-w-2xl flex flex-col items-center text-center space-y-6 my-auto pt-12">
      <div class="inline-flex items-center gap-2 px-4 py-1.5 text-xs text-gray-600 bg-white/80 border border-gray-200/80 rounded-full shadow-2xs">
        <span class="text-blue-500">✨</span>
        <span>Bluebex-V4.1-Flash Public Release</span>
      </div>

      <h1 class="text-5xl font-light text-gray-800 tracking-tight">
        Into the Unknown
      </h1>

      <!-- Center Input Box -->
      <form id="hero-chat-form" class="w-full bg-white border border-gray-200/90 rounded-3xl p-4 shadow-xl shadow-blue-900/5 transition-all focus-within:border-blue-400">
        <textarea
          id="hero-user-input"
          rows="3"
          placeholder="Ask anything, explore together..."
          class="w-full bg-transparent border-none outline-none text-gray-800 placeholder-gray-400 text-sm resize-none"
        ></textarea>

        <div class="flex items-center justify-between pt-2">
          <div class="flex items-center gap-2">
            <button type="button" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium text-gray-600 bg-gray-100">
              <i data-lucide="brain" class="w-3.5 h-3.5 text-gray-500"></i> DeepThink
            </button>
            <button type="button" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium text-blue-600 bg-blue-50">
              <i data-lucide="globe" class="w-3.5 h-3.5 text-blue-500"></i> Search
            </button>
          </div>
          <button type="submit" class="p-2.5 bg-blue-600 text-white rounded-full hover:bg-blue-700 transition">
            <i data-lucide="arrow-up" class="w-4 h-4"></i>
          </button>
        </div>
      </form>
    </div>

    <!-- Chat Messages Screen -->
    <div id="chat-feed" class="w-full max-w-2xl flex-1 flex-col space-y-6 pt-24 pb-36 hidden">
      <div id="messages-list" class="space-y-6 w-full"></div>
    </div>

  </main>

  <!-- Sticky Bottom Input Bar -->
  <footer id="bottom-bar" class="fixed bottom-0 left-0 right-0 bg-gradient-to-t from-[#f4f7fb] via-[#f4f7fb]/90 to-transparent pt-6 pb-6 px-4 flex justify-center z-40 hidden">
    <div class="w-full max-w-2xl bg-white border border-gray-200 rounded-2xl shadow-lg p-3">
      <form id="active-chat-form" class="flex flex-col gap-2">
        <textarea
          id="active-user-input"
          rows="2"
          placeholder="Ask anything, explore together..."
          class="w-full bg-transparent border-none outline-none text-gray-800 placeholder-gray-400 px-2 text-sm resize-none"
        ></textarea>
        <div class="flex items-center justify-between pt-1 border-t border-gray-100">
          <span class="text-xs text-gray-400 px-2">Bluebex Public AI</span>
          <button type="submit" class="p-2 bg-blue-600 text-white rounded-full hover:bg-blue-700 transition">
            <i data-lucide="arrow-up" class="w-4 h-4"></i>
          </button>
        </div>
      </form>
    </div>
  </footer>

  <script>
    lucide.createIcons();

    const heroView = document.getElementById('hero-view');
    const chatFeed = document.getElementById('chat-feed');
    const messagesList = document.getElementById('messages-list');
    const bottomBar = document.getElementById('bottom-bar');
    const mainContainer = document.getElementById('main-container');

    const heroForm = document.getElementById('hero-chat-form');
    const heroInput = document.getElementById('hero-user-input');

    const activeForm = document.getElementById('active-chat-form');
    const activeInput = document.getElementById('active-user-input');

    let history = [];

    heroForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = heroInput.value.trim();
      if (!text) return;

      heroView.classList.add('hidden');
      chatFeed.classList.remove('hidden');
      chatFeed.classList.add('flex');
      bottomBar.classList.remove('hidden');

      sendMessage(text);
    });

    activeForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = activeInput.value.trim();
      if (!text) return;
      activeInput.value = '';
      sendMessage(text);
    });

    async function sendMessage(text) {
      appendMessage('user', text);
      history.push({ role: 'user', content: text });

      const loadingId = appendLoading();
      mainContainer.scrollTop = mainContainer.scrollHeight;

      try {
        const res = await fetch('/api', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history })
        });

        const data = await res.json();
        document.getElementById(loadingId)?.remove();

        if (res.ok && data.reply) {
          appendMessage('assistant', data.reply);
          history.push({ role: 'assistant', content: data.reply });
        } else {
          appendMessage('assistant', `⚠️ **Error:** ${data.error || 'Check Vercel Environment Variables.'}`);
        }
      } catch (err) {
        document.getElementById(loadingId)?.remove();
        appendMessage('assistant', '⚠️ **Network Error:** Could not reach backend function `/api`.');
      }

      mainContainer.scrollTop = mainContainer.scrollHeight;
    }

    function appendMessage(role, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = 'w-full flex ' + (role === 'user' ? 'justify-end' : 'justify-start');

      if (role === 'user') {
        msgDiv.innerHTML = `
          <div class="bg-blue-600 text-white px-4 py-2.5 rounded-2xl max-w-[85%] text-sm leading-relaxed whitespace-pre-wrap shadow-sm">
            ${escapeHtml(text)}
          </div>
        `;
      } else {
        msgDiv.innerHTML = `
          <div class="flex gap-3 w-full">
            <div class="w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center shrink-0 mt-0.5 text-white font-extrabold text-xs shadow-xs">
              B
            </div>
            <div class="flex-1 text-gray-800 text-sm leading-relaxed prose max-w-none pt-0.5">
              ${marked.parse(text)}
            </div>
          </div>
        `;
      }

      messagesList.appendChild(msgDiv);
      lucide.createIcons();
    }

    function appendLoading() {
      const id = 'loading-' + Date.now();
      const div = document.createElement('div');
      div.id = id;
      div.className = 'w-full flex justify-start';
      div.innerHTML = `
        <div class="flex gap-3 w-full">
          <div class="w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center shrink-0 mt-0.5 text-white font-bold text-xs animate-pulse">
            B
          </div>
          <div class="flex flex-col gap-1.5 pt-2 w-32 animate-pulse">
            <div class="h-2 bg-gray-200 rounded-full w-full"></div>
            <div class="h-2 bg-gray-200 rounded-full w-2/3"></div>
          </div>
        </div>
      `;
      messagesList.appendChild(div);
      return id;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
