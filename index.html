<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bluebex AI</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#f4f7fb] text-gray-800 h-screen flex flex-col font-sans overflow-hidden">

  <!-- Top Navigation Header -->
  <header class="fixed top-0 left-0 right-0 w-full px-8 py-5 flex items-center justify-between z-50 bg-transparent">
    <!-- Enlarged Top-Left Logo -->
    <div class="flex items-center gap-2.5 cursor-pointer" id="brand-home">
      <div class="w-8 h-8 bg-blue-600 rounded-xl flex items-center justify-center text-white font-black text-base shadow-sm">
        B
      </div>
      <span class="font-extrabold text-2xl text-blue-600 tracking-tight">bluebex</span>
    </div>

    <!-- Top-Right Actions -->
    <div class="flex items-center gap-5 text-xs font-semibold text-gray-600">
      <button class="hover:text-black transition">Get App</button>
      <div class="flex bg-gray-200/60 p-0.5 rounded-full">
        <button id="lang-cn" class="px-2.5 py-1 rounded-full text-gray-500 hover:text-black">中文</button>
        <button id="lang-en" class="px-2.5 py-1 rounded-full bg-white shadow-xs text-black">EN</button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 flex flex-col items-center justify-center relative overflow-y-auto px-4" id="main-container">
    
    <!-- Hero Home View (Image 2 Match) -->
    <div id="hero-view" class="w-full max-w-2xl flex flex-col items-center text-center space-y-6 my-auto pt-12">
      <!-- Announcement Pill -->
      <div class="inline-flex items-center gap-2 px-4 py-1.5 text-xs text-gray-600 bg-white/80 border border-gray-200/80 rounded-full shadow-2xs backdrop-blur-sm">
        <span class="text-blue-500">✨</span>
        <span>The official version of Bluebex-V4.1-Flash has been released.</span>
        <span class="text-gray-400">→</span>
      </div>

      <!-- Hero Heading -->
      <h1 class="text-5xl font-light text-gray-800 tracking-tight font-serif italic md:not-italic md:font-normal">
        Into the Unknown
      </h1>

      <!-- Center Chat Form Box -->
      <form id="hero-chat-form" class="w-full bg-white border border-gray-200/90 rounded-3xl p-4 shadow-xl shadow-blue-900/5 transition-all focus-within:border-blue-400">
        <textarea
          id="hero-user-input"
          rows="3"
          placeholder="Ask anything, explore together..."
          class="w-full bg-transparent border-none outline-none text-gray-800 placeholder-gray-400 text-sm resize-none"
        ></textarea>

        <div class="flex items-center justify-between pt-2">
          <div class="flex items-center gap-2">
            <button type="button" id="btn-deepthink" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium text-gray-600 bg-gray-100 hover:bg-gray-200 transition">
              <i data-lucide="brain" class="w-3.5 h-3.5 text-gray-500"></i> DeepThink
            </button>
            <button type="button" id="btn-search" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium text-blue-600 bg-blue-50 hover:bg-blue-100 transition">
              <i data-lucide="globe" class="w-3.5 h-3.5 text-blue-500"></i> Search
            </button>
          </div>
          <button type="submit" class="p-2.5 bg-blue-600 text-white rounded-full hover:bg-blue-700 transition shadow-sm">
            <i data-lucide="arrow-up" class="w-4 h-4"></i>
          </button>
        </div>
      </form>

      <!-- Quick Action Pills -->
      <div class="flex items-center gap-3 pt-2">
        <button class="px-4 py-1.5 rounded-full bg-white border border-gray-200 text-xs font-medium text-gray-700 hover:bg-gray-50 shadow-2xs flex items-center gap-1.5">
          <i data-lucide="message-square" class="w-3.5 h-3.5 text-gray-400"></i> Chat with Bluebex
        </button>
        <button class="px-4 py-1.5 rounded-full bg-white border border-gray-200 text-xs font-medium text-gray-700 hover:bg-gray-50 shadow-2xs flex items-center gap-1.5">
          <i data-lucide="code-2" class="w-3.5 h-3.5 text-gray-400"></i> Use API Platform
        </button>
      </div>
    </div>

    <!-- Active Chat Feed (Hidden until first message) -->
    <div id="chat-feed" class="w-full max-w-2xl flex-1 flex-col space-y-6 pt-24 pb-36 hidden">
      <div id="messages-list" class="space-y-6 w-full"></div>
    </div>

  </main>

  <!-- Fixed Bottom Input Bar (Appears during chat) -->
  <footer id="bottom-bar" class="fixed bottom-0 left-0 right-0 bg-gradient-to-t from-[#f4f7fb] via-[#f4f7fb]/90 to-transparent pt-6 pb-6 px-4 flex justify-center z-40 hidden">
    <div class="w-full max-w-2xl bg-white border border-gray-200 rounded-2xl shadow-lg p-3">
      <form id="active-chat-form" class="flex flex-col gap-2">
        <textarea
          id="active-user-input"
          rows="2"
          placeholder="Ask anything, explore together..."
          class="w-full bg-transparent border-none outline-none text-gray-800 placeholder-gray-400 px-2 text-sm resize-none"
        ></textarea>
        <div class="flex items-center justify-between pt-1 border-t border-gray-100">
          <span class="text-xs text-gray-400 px-2">Bluebex V4.1</span>
          <button type="submit" class="p-2 bg-blue-600 text-white rounded-full hover:bg-blue-700 transition">
            <i data-lucide="arrow-up" class="w-4 h-4"></i>
          </button>
        </div>
      </form>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
