<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bluebex AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme text-gray-800 h-screen flex flex-col font-sans overflow-hidden">

  <!-- Floating Pill Header -->
  <header id="main-header" class="fixed top-4 left-1/2 -translate-x-1/2 w-[96%] max-w-5xl bg-white/90 backdrop-blur-md rounded-full px-6 py-3 flex items-center justify-between z-50 shadow-[0_4px_20px_rgba(0,0,0,0.04)] border border-gray-200/60">
    <div class="flex items-center gap-2">
      <img src="logo.png" alt="Logo" class="h-6 w-auto" onerror="this.style.display='none'">
      <span class="font-bold text-xl text-[#3b82f6] tracking-tight">bluebex</span>
    </div>
    <div class="flex items-center gap-5 text-sm font-medium">
      <a href="#" class="text-gray-600 hover:text-black">Get App</a>
      <div class="flex bg-gray-100 p-0.5 rounded-full border border-gray-200">
        <button class="px-3 py-1 rounded-full text-xs text-gray-500 hover:text-black">中文</button>
        <button class="px-3 py-1 rounded-full text-xs bg-white shadow-sm font-semibold text-black">EN</button>
      </div>
      <a href="login.html" id="auth-link" class="text-blue-600 hover:underline">Log in</a>
    </div>
  </header>

  <!-- Chat & Hero Area -->
  <main class="flex-1 overflow-y-auto px-4 pt-32 pb-40 flex justify-center" id="chat-container">
    <div class="w-full max-w-3xl flex flex-col space-y-8" id="messages">
      
      <!-- Landing Hero Screen -->
      <div id="welcome-screen" class="flex flex-col items-center justify-center min-h-[50vh] text-center space-y-6">
        
        <div class="inline-flex items-start gap-2 px-4 py-2 text-[13px] text-gray-500 max-w-2xl text-center leading-relaxed">
          <span class="text-blue-400 mt-0.5">✨</span>
          <p>The official version of Bluebex-V4.1-Flash has been released, featuring comprehensive improvements in text and Agent performance, along with native multimodal visual understanding capabilities. &rarr;</p>
        </div>

        <h1 class="text-5xl font-normal text-gray-800 tracking-tight pb-2">
          Into the Unknown
        </h1>

        <!-- Search Input Box -->
        <div class="w-full bg-white/95 backdrop-blur-xl border border-gray-200/80 rounded-2xl shadow-[0_10px_30px_rgba(0,0,0,0.06)] p-3 transition-all focus-within:ring-2 focus-within:ring-blue-400/30">
          <form id="chat-form" class="flex flex-col gap-3">
            <input type="file" id="file-upload" class="hidden" accept=".txt,.js,.py,.html,.css,.json,.md,.csv">
            
            <textarea
              id="user-input"
              rows="2"
              placeholder="Ask anything, explore together"
              class="w-full bg-transparent border-none outline-none text-gray-800 placeholder-gray-400 px-3 pt-1 text-base resize-none"
              required
            ></textarea>
            
            <div class="flex items-center justify-between px-1">
              <div class="flex items-center gap-2">
                <button type="button" onclick="document.getElementById('file-upload').click()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium text-gray-600 bg-gray-100 hover:bg-gray-200 transition">
                  <i data-lucide="paperclip" class="w-3.5 h-3.5"></i> Attach
                </button>
                <button type="button" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium text-gray-600 bg-gray-100 hover:bg-gray-200 transition">
                  <i data-lucide="brain" class="w-3.5 h-3.5"></i> DeepThink
                </button>
                <button type="button" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium text-blue-600 bg-blue-50 hover:bg-blue-100 transition">
                  <i data-lucide="globe" class="w-3.5 h-3.5"></i> Search
                </button>
              </div>
              <button type="submit" class="p-2.5 bg-blue-600 text-white rounded-full hover:bg-blue-700 transition shadow-md">
                <i data-lucide="arrow-up" class="w-4 h-4 stroke-[3]"></i>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
